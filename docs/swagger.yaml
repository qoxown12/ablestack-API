basePath: /api/v1
definitions:
  DiskResponse:
    properties:
      blockdevices:
        items:
          $ref: '#/definitions/ablecloud_io_ablestack-api_internal_model_cube.DiskDevice'
        type: array
      raidcontrollers:
        items:
          additionalProperties:
            type: string
          type: object
        type: array
      refresh_time:
        type: string
    type: object
  Errorlog:
    properties:
      error:
        format: string
        type: string
      refresh_time:
        format: time
        type: string
    type: object
  HTTP400BadRequest:
    properties:
      err_code:
        example: 400
        type: integer
      message:
        example: status bad request
        type: string
    type: object
  HTTP404NotFound:
    properties:
      err_code:
        example: 404
        type: integer
      message:
        example: Not Found
        type: string
    type: object
  HTTP500InternalServerError:
    properties:
      err_code:
        example: 500
        type: integer
      message:
        example: InternalServerError
        type: string
    type: object
  NICResponse:
    properties:
      bonds:
        items:
          $ref: '#/definitions/ablecloud_io_ablestack-api_internal_model_cube.NICDevice'
        type: array
      bridges:
        items:
          $ref: '#/definitions/ablecloud_io_ablestack-api_internal_model_cube.NICDevice'
        type: array
      ethernets:
        items:
          $ref: '#/definitions/ablecloud_io_ablestack-api_internal_model_cube.NICDevice'
        type: array
      others:
        items:
          $ref: '#/definitions/ablecloud_io_ablestack-api_internal_model_cube.NICDevice'
        type: array
      refresh_time:
        type: string
    type: object
  ablecloud_io_ablestack-api_internal_infra_utils.TypeVersion:
    properties:
      ablestack_package_versions:
        items:
          type: string
        type: array
      cockpit_version:
        type: string
      debug:
        type: boolean
      glue_version:
        type: string
      kernel_version:
        type: string
      mold_version:
        type: string
      os_version:
        type: string
    type: object
  ablecloud_io_ablestack-api_internal_model_cube.AutoShutdownMountResult:
    properties:
      message:
        example: ok
        type: string
      mount_point:
        example: /mnt/data
        type: string
      source:
        example: UUID=xxxx
        type: string
      status:
        example: unmounted
        type: string
    type: object
  ablecloud_io_ablestack-api_internal_model_cube.AutoShutdownRequest:
    properties:
      action:
        description: 'action: check_mount/stop_scvms/shutdown_hosts'
        example: check_mount
        type: string
    type: object
  ablecloud_io_ablestack-api_internal_model_cube.AutoShutdownResponse:
    properties:
      action:
        example: shutdown_hosts
        type: string
      code:
        example: 200
        type: integer
      message:
        example: ok
        type: string
      mounts:
        items:
          $ref: '#/definitions/ablecloud_io_ablestack-api_internal_model_cube.AutoShutdownMountResult'
        type: array
      results:
        items:
          $ref: '#/definitions/ablecloud_io_ablestack-api_internal_model_cube.AutoShutdownTargetResult'
        type: array
      retname:
        example: Hosts Shutdown
        type: string
      target:
        example: 10.10.31.1
        type: string
      val: {}
    type: object
  ablecloud_io_ablestack-api_internal_model_cube.AutoShutdownTargetResult:
    properties:
      action:
        example: shutdown_hosts
        type: string
      code:
        example: 200
        type: integer
      hostname:
        example: ablecube31-1
        type: string
      message:
        example: ok
        type: string
      mounts:
        items:
          $ref: '#/definitions/ablecloud_io_ablestack-api_internal_model_cube.AutoShutdownMountResult'
        type: array
      retname:
        example: Hosts Shutdown
        type: string
      target:
        example: 10.10.31.1
        type: string
      val: {}
    type: object
  ablecloud_io_ablestack-api_internal_model_cube.BondDetail:
    properties:
      ACTIVE_SLAVE:
        type: string
      AD_SELECT:
        type: string
      DOWNDELAY:
        type: integer
      FAIL_OVER_MAC:
        type: string
      LACP_ACTIVE:
        type: string
      LACP_RATE:
        type: string
      MIIMON:
        type: integer
      MODE:
        type: string
      PRIMARY:
        type: string
      PRIMARY_RESELECT:
        type: string
      UPDELAY:
        type: integer
      XMIT_HASH_POLICY:
        type: string
    type: object
  ablecloud_io_ablestack-api_internal_model_cube.BootstrapHealthResult:
    properties:
      attempts:
        example: 2
        type: integer
      code:
        example: 200
        type: integer
      hostname:
        example: scvm1
        type: string
      message:
        example: ok
        type: string
      role:
        example: scvm
        type: string
      target:
        example: 10.10.31.11
        type: string
    type: object
  ablecloud_io_ablestack-api_internal_model_cube.BootstrapRequest:
    properties:
      license_content:
        description: 라이선스 파일 내용(base64). 비어 있으면 현재 로컬 라이선스를 재사용한다.
        example: BASE64_CONTENT
        type: string
      license_filename:
        description: 대상 노드에 저장할 라이선스 파일 이름.
        example: license.lic
        type: string
      licenses:
        additionalProperties:
          type: string
        description: hostname, role, target IP, index, scvmN 이름별 라이선스 내용.
        type: object
      run_script:
        description: VM API health/license 단계 전에 host qemu-guest-agent로 /root/bootstrap.sh를
          실행할지 여부.
        example: true
        type: boolean
      target_hostnames:
        description: cluster.json hosts[].hostname 기준 명시 대상. ccvm은 "ccvm"으로 선택할 수
          있다.
        example:
        - scvm1
        - scvm2
        items:
          type: string
        type: array
    type: object
  ablecloud_io_ablestack-api_internal_model_cube.BootstrapResponse:
    properties:
      code:
        example: 200
        type: integer
      health:
        items:
          $ref: '#/definitions/ablecloud_io_ablestack-api_internal_model_cube.BootstrapHealthResult'
        type: array
      license_apply:
        $ref: '#/definitions/ablecloud_io_ablestack-api_internal_model_cube.LicenseApplyResponse'
      license_status:
        $ref: '#/definitions/ablecloud_io_ablestack-api_internal_model_cube.LicenseApplyResponse'
      message:
        example: scvm_bootstrap success
        type: string
      role:
        example: scvm
        type: string
      script:
        items:
          $ref: '#/definitions/ablecloud_io_ablestack-api_internal_model_cube.BootstrapScriptResult'
        type: array
    type: object
  ablecloud_io_ablestack-api_internal_model_cube.BootstrapScriptResult:
    properties:
      code:
        example: 200
        type: integer
      domain:
        example: scvm
        type: string
      hostname:
        example: scvm1
        type: string
      message:
        example: ok
        type: string
      output:
        example: bootstrap log tail
        type: string
      role:
        example: scvm
        type: string
      target:
        example: 10.10.31.1
        type: string
    type: object
  ablecloud_io_ablestack-api_internal_model_cube.CCVMBackupRequest:
    properties:
      action:
        description: 'action: backup/status/list/overview/schedule/unschedule/schedule-delete/unschedule-delete'
        example: backup
        type: string
      day:
        description: day of month
        example: 1
        type: integer
      month:
        description: month
        example: 1
        type: integer
      repeat:
        description: 'repeat option: hourly/daily/monthly/yearly'
        example: daily
        type: string
      retain_months:
        description: retention months for delete schedule
        example: 3
        type: integer
      target_dir:
        description: backup target directory
        example: /mnt/glue-gfs/backup/ccvm
        type: string
      time:
        description: time in HH:MM
        example: "01:00"
        type: string
    type: object
  ablecloud_io_ablestack-api_internal_model_cube.CCVMBackupResponse:
    properties:
      action:
        description: 수행한 action
        example: backup
        type: string
      code:
        description: 처리 결과 코드
        example: 200
        type: integer
      message:
        description: 처리 결과 메시지
        type: string
      retname:
        description: 기존 Python createReturn 호환 결과명
        type: string
      target:
        description: 실제 처리 대상
        example: 10.10.31.1
        type: string
      val:
        description: 기존 Python createReturn 호환 결과값
    type: object
  ablecloud_io_ablestack-api_internal_model_cube.CCVMCloudInitCreateRequest:
    properties:
      sn_dns:
        description: service DNS for ccvm
        example: 8.8.8.8
        type: string
      sn_gw:
        description: service gateway for ccvm
        example: 10.10.0.1
        type: string
      sn_ip:
        description: service IP for ccvm
        example: 10.10.14.151
        type: string
      sn_nic:
        description: service NIC for ccvm
        example: enp0s21
        type: string
      sn_prefix:
        description: service prefix for ccvm
        example: 16
        type: integer
    type: object
  ablecloud_io_ablestack-api_internal_model_cube.CCVMEditRequest:
    properties:
      cpu:
        description: vCPU 개수
        example: "8"
        type: string
      memory:
        description: 메모리 크기(GiB)
        example: "16"
        type: string
    type: object
  ablecloud_io_ablestack-api_internal_model_cube.CCVMEditResponse:
    properties:
      code:
        description: 전체 처리 결과 코드
        example: 200
        type: integer
      message:
        description: 전체 처리 결과 메시지
        example: ccvm xml updated
        type: string
      results:
        description: 대상 호스트별 상세 결과 목록
        items:
          $ref: '#/definitions/ablecloud_io_ablestack-api_internal_model_cube.CCVMEditResult'
        type: array
    type: object
  ablecloud_io_ablestack-api_internal_model_cube.CCVMEditResult:
    properties:
      code:
        description: 처리 결과 코드
        example: 200
        type: integer
      message:
        description: 처리 결과 메시지
        example: ok
        type: string
      target:
        description: 수정 대상 호스트 IP 또는 식별자
        example: 10.10.31.1
        type: string
      xml_path:
        description: 수정된 XML 파일 경로
        example: /etc/ablestack/vmconfig/ccvm/ccvm.xml
        type: string
    type: object
  ablecloud_io_ablestack-api_internal_model_cube.CCVMLifecycleRequest:
    properties:
      action:
        description: 'action: setup/reset/copy/start/stop/restart/delete'
        example: reset
        type: string
      destroy:
        description: stop action에서 virsh shutdown 대신 destroy를 사용할지 여부
        example: false
        type: boolean
      disk:
        description: optional GFS disk path override for reset action
        example: /dev/sdb
        type: string
      purge:
        description: delete action에서 CCVM 이미지까지 삭제할지 여부
        example: false
        type: boolean
    type: object
  ablecloud_io_ablestack-api_internal_model_cube.CCVMLifecycleResponse:
    properties:
      action:
        example: reset
        type: string
      code:
        example: 200
        type: integer
      message:
        example: ok
        type: string
      os_type:
        example: ablestack-hci
        type: string
      results:
        items:
          $ref: '#/definitions/ablecloud_io_ablestack-api_internal_model_cube.ClusterApplyResult'
        type: array
      retname:
        example: CCVM Lifecycle
        type: string
      val:
        example: cloud center reset success
        type: string
    type: object
  ablecloud_io_ablestack-api_internal_model_cube.CCVMPCSControlRequest:
    properties:
      action:
        description: 'action: setup/config/create/enable/disable/move/cleanup/status/remove/destroy/stop/sync/ccvm-status'
        example: status
        type: string
      cluster:
        description: cluster name for config action
        example: cloudcenter_cluster
        type: string
      hosts:
        description: hostnames for config action
        example:
        - ablecube31-1
        - ablecube31-2
        - ablecube31-3
        items:
          type: string
        type: array
      resource:
        description: PCS resource name. 비어 있으면 cloudcenter_res를 사용한다.
        example: cloudcenter_res
        type: string
      target:
        description: target hostname/IP for move action
        example: ablecube31-2
        type: string
      time:
        description: cluster token time for sync action
        example: "3000"
        type: string
      xml:
        description: CCVM libvirt XML path for create action
        example: /etc/libvirt/qemu/ccvm.xml
        type: string
    type: object
  ablecloud_io_ablestack-api_internal_model_cube.CCVMPCSControlResponse:
    properties:
      action:
        example: status
        type: string
      code:
        example: 200
        type: integer
      message:
        type: string
      retname:
        type: string
      target:
        example: 10.10.31.1
        type: string
      val: {}
    type: object
  ablecloud_io_ablestack-api_internal_model_cube.CCVMRestoreRequest:
    properties:
      target_file:
        description: backup file name for restore
        example: ccvm.qcow2-20260430_010000
        type: string
    type: object
  ablecloud_io_ablestack-api_internal_model_cube.CCVMSecondaryResizeRequest:
    properties:
      add_size:
        description: additional capacity size in GiB, 1~500
        example: 100
        type: integer
    type: object
  ablecloud_io_ablestack-api_internal_model_cube.CCVMSecondaryResizeResponse:
    properties:
      code:
        example: 200
        type: integer
      message:
        example: ok
        type: string
      os_type:
        example: ablestack-hci
        type: string
      retname:
        example: CCVM Secondary Resize
        type: string
      target:
        example: 10.10.31.1
        type: string
      val:
        example: CCVM secondary filesystem expansion success.
        type: string
    type: object
  ablecloud_io_ablestack-api_internal_model_cube.CCVMServiceControlRequest:
    properties:
      action:
        description: 'action: start/restart/stop/status'
        example: start
        type: string
      service_name:
        description: service name
        example: mold
        type: string
    type: object
  ablecloud_io_ablestack-api_internal_model_cube.CCVMServiceControlResponse:
    properties:
      code:
        example: 200
        type: integer
      val:
        example: mold service start control success
        type: string
    type: object
  ablecloud_io_ablestack-api_internal_model_cube.CCVMSnapRequest:
    properties:
      action:
        description: 'action: list/backup/rollback'
        example: backup
        type: string
      snap_name:
        description: snapshot name for rollback, or optional custom name for backup
        example: 2026-04-29-10:00:00
        type: string
    type: object
  ablecloud_io_ablestack-api_internal_model_cube.CCVMSnapResponse:
    properties:
      action:
        description: 수행한 action
        example: backup
        type: string
      code:
        description: 처리 결과 코드
        example: 200
        type: integer
      deleted_snapshots:
        description: backup 후 보관 정책으로 삭제한 snapshot 이름 목록
        items:
          type: string
        type: array
      message:
        description: 처리 결과 메시지
        example: CCVM Snapshot Backup Create Success
        type: string
      snap_name:
        description: 생성 또는 복구 대상 snapshot 이름
        example: 2026-04-29-10:00:00
        type: string
      target:
        description: 실제 작업을 수행한 대상 ablecube IP 또는 식별자
        example: 10.10.31.1
        type: string
      val:
        description: 기존 Python createReturn 호환 결과값
    type: object
  ablecloud_io_ablestack-api_internal_model_cube.CCVMStatusResponse:
    properties:
      code:
        example: 200
        type: integer
      data: {}
      message:
        type: string
    type: object
  ablecloud_io_ablestack-api_internal_model_cube.CCVMXMLCreateRequest:
    properties:
      cpu:
        description: vCPU 개수
        example: 4
        type: integer
      gfs_mount_point:
        description: GFS mount point. ablestack-vm에서 ccvm.qcow2 경로 계산에 사용한다.
        example: /mnt/glue-gfs
        type: string
      management_network_bridge:
        description: management network bridge
        example: br0
        type: string
      memory:
        description: 메모리 크기(GiB)
        example: 16
        type: integer
      service_network_bridge:
        description: optional service network bridge
        example: br1
        type: string
    type: object
  ablecloud_io_ablestack-api_internal_model_cube.CCVMXMLCreateResponse:
    properties:
      code:
        description: 처리 결과 코드
        example: 200
        type: integer
      message:
        description: 처리 결과 메시지
        example: 클라우드센터 가상머신 xml 생성 성공
        type: string
      results:
        description: fan-out 대상별 결과
        items:
          $ref: '#/definitions/ablecloud_io_ablestack-api_internal_model_cube.ClusterApplyResult'
        type: array
      val:
        description: 기존 Python createReturn 호환 결과값
      xml_path:
        description: 생성된 XML 파일 경로
        example: /etc/ablestack/vmconfig/ccvm/ccvm.xml
        type: string
    type: object
  ablecloud_io_ablestack-api_internal_model_cube.CLVMManageRequest:
    properties:
      action:
        description: 'action: create-clvm/list-clvm/delete-clvm'
        example: list-clvm
        type: string
      disk:
        description: comma separated disk list for legacy clients
        example: /dev/disk/by-id/dm-uuid-mpath-3600...
        type: string
      disks:
        description: disk list
        example:
        - /dev/disk/by-id/dm-uuid-mpath-3600...
        items:
          type: string
        type: array
      pv_name:
        description: comma separated PV names for delete-clvm
        example: /dev/sdb1
        type: string
      pv_names:
        description: PV name list for delete-clvm
        example:
        - /dev/sdb1
        - /dev/sdc1
        items:
          type: string
        type: array
      vg_name:
        description: comma separated VG names for delete-clvm
        example: vg_clvm01
        type: string
      vg_names:
        description: VG name list for delete-clvm
        example:
        - vg_clvm01
        - vg_clvm02
        items:
          type: string
        type: array
    type: object
  ablecloud_io_ablestack-api_internal_model_cube.CLVMManageResponse:
    properties:
      action:
        example: list-clvm
        type: string
      code:
        example: 200
        type: integer
      message:
        example: ok
        type: string
      val: {}
    type: object
  ablecloud_io_ablestack-api_internal_model_cube.CloudInitStatusRequest:
    properties:
      action:
        description: 'action: status/ping'
        example: status
        type: string
      target:
        description: 'target role or direct target IP: ccvm/scvm/10.10.31.10'
        example: ccvm
        type: string
      target_hostname:
        description: comma-separated hostnames for scvm target
        example: ablecube31-1
        type: string
    type: object
  ablecloud_io_ablestack-api_internal_model_cube.CloudInitStatusResponse:
    properties:
      action:
        example: status
        type: string
      code:
        example: 200
        type: integer
      message:
        example: cloud-init status check success
        type: string
      results:
        items:
          $ref: '#/definitions/ablecloud_io_ablestack-api_internal_model_cube.CloudInitStatusResult'
        type: array
      retname:
        example: CloudInit Status
        type: string
      val: {}
    type: object
  ablecloud_io_ablestack-api_internal_model_cube.CloudInitStatusResult:
    properties:
      code:
        example: 200
        type: integer
      hostname:
        example: ablecube31-1
        type: string
      message:
        example: ok
        type: string
      role:
        example: ccvm
        type: string
      target:
        example: 10.10.31.10
        type: string
      val: {}
    type: object
  ablecloud_io_ablestack-api_internal_model_cube.ClusterApplyLocalResponse:
    properties:
      code:
        example: 200
        type: integer
      val:
        example: Cluster Config insert Success
        type: string
    type: object
  ablecloud_io_ablestack-api_internal_model_cube.ClusterApplyRequest:
    properties:
      action:
        description: 'action: insert/remove/reset/check'
        example: insert
        type: string
      ccvm:
        allOf:
        - $ref: '#/definitions/ablecloud_io_ablestack-api_internal_model_cube.ClusterCCVMConfig'
        description: ccvm config (ip only)
      exclude_hostname:
        description: exclude hostname (hci only)
        example: ablecube31-2
        type: string
      external_timeserver:
        description: external timeserver
        example: time.google.com
        type: string
      hosts:
        description: hosts list (preferred)
        items:
          $ref: '#/definitions/ablecloud_io_ablestack-api_internal_model_cube.ClusterHost'
        type: array
      mngtNic:
        allOf:
        - $ref: '#/definitions/ablecloud_io_ablestack-api_internal_model_cube.ClusterMngtNicConfig'
        description: management NIC config
      new_hostname:
        description: 'new hostname (option=add: exclude scvm fanout)'
        example: ablecube12-3
        type: string
      option:
        description: option (e.g. add/hostOnly/withScvm/all/local)
        example: add
        type: string
      pcs_cluster_list:
        description: pcs cluster node IP list
        example:
        - 10.10.31.1
        - 10.10.31.2
        - 10.10.31.3
        items:
          type: string
        type: array
      remove_hostname:
        description: remove hostname
        example: ablecube31-3
        type: string
      storage_network:
        description: storage network usage (true/false)
        example: "false"
        type: string
      type:
        description: cluster type (e.g. ablestack-vm, ablestack-hci)
        example: ablestack-vm
        type: string
    type: object
  ablecloud_io_ablestack-api_internal_model_cube.ClusterApplyResponse:
    properties:
      code:
        example: 200
        type: integer
      message:
        example: apply success
        type: string
      results:
        items:
          $ref: '#/definitions/ablecloud_io_ablestack-api_internal_model_cube.ClusterApplyResult'
        type: array
    type: object
  ablecloud_io_ablestack-api_internal_model_cube.ClusterApplyResult:
    properties:
      code:
        example: 200
        type: integer
      message:
        example: ok
        type: string
      target:
        example: 10.10.31.1
