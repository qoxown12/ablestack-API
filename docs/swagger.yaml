paths:
  /auth/internal-token/apply:
    post:
      security: []
      consumes:
      - application/json
      description: 내부 API 서버 간 호출로 전달받은 X-Cube-Internal-Token 값을 현재 호스트에 적용합니다.
      parameters:
      - description: current internal token
        in: header
        name: X-Cube-Internal-Token
        required: true
        type: string
      - description: internal token apply request
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handler_auth.InternalTokenApplyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Apply Internal Token
      tags:
      - Auth
  /auth/internal-token/rotate:
    post:
      description: 클러스터 내부 API 호출용 X-Cube-Internal-Token 값을 교체하고 대상 AbleCube 노드에 적용합니다.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler_auth.InternalTokenRotateResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Rotate Internal Token
      tags:
      - Auth
  /auth/login:
    post:
      security: []
      consumes:
      - application/json
      description: 웹 UI/API용 access token을 발급합니다.
      parameters:
      - description: login request
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handler_auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler_auth.LoginResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      summary: Login
      tags:
      - Auth
  /auth/me:
    get:
      description: Bearer token을 검증하고 현재 token claim을 반환합니다.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
